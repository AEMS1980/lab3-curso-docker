apiVersion: v1
kind: Namespace
metadata:
  name: ns-augusto-martinez
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-augusto-martinez
  namespace: ns-augusto-martinez
data:
  AMBIENTE: "laboratorio-augusto-martinez"
---
apiVersion: v1
kind: Secret
metadata:
  name: secret-augusto-martinez
  namespace: ns-augusto-martinez
type: Opaque
stringData:
  API_KEY: "demo-lab3-augusto-sin-valor-real"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-augusto-martinez
  namespace: ns-augusto-martinez
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-augusto-martinez
  template:
    metadata:
      labels:
        app: app-augusto-martinez
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: augustomartinez1980/tarea-final:augusto-martinez
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: AMBIENTE
              valueFrom:
                configMapKeyRef:
                  name: config-augusto-martinez
                  key: AMBIENTE
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: secret-augusto-martinez
                  key: API_KEY
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /lab
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: svc-augusto-martinez
  namespace: ns-augusto-martinez
spec:
  type: ClusterIP
  selector:
    app: app-augusto-martinez
  ports:
    - name: http
      port: 80
      targetPort: http
