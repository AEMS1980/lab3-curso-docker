apiVersion: v1
kind: Pod
metadata:
  labels:
    purpose: lab3-augusto-martinez
spec:
  serviceAccountName: lab3-deployer
  containers:
    - name: node
      image: node:24-bookworm
      command: ["sleep"]
      args: ["infinity"]
      securityContext:
        runAsUser: 0
      resources:
        requests: {cpu: 250m, memory: 512Mi}
        limits: {cpu: "2", memory: 2Gi}
    - name: docker
      image: docker:28-cli
      command: ["sleep"]
      args: ["infinity"]
      env:
        - name: DOCKER_HOST
          value: unix:///var/run/lab3/docker.sock
      volumeMounts:
        - name: docker-socket
          mountPath: /var/run/lab3
    - name: dind
      image: docker:28-dind
      command: ["dockerd"]
      args: ["--host=unix:///var/run/lab3/docker.sock", "--group=0"]
      securityContext:
        privileged: true
      volumeMounts:
        - name: docker-socket
          mountPath: /var/run/lab3
        - name: docker-data
          mountPath: /var/lib/docker
      resources:
        requests: {cpu: 250m, memory: 512Mi}
        limits: {cpu: "2", memory: 2Gi}
  volumes:
    - name: docker-socket
      emptyDir: {}
    - name: docker-data
      emptyDir: {}
